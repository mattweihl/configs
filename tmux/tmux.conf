set-option -g prefix C-b

set -sg escape-time 0
set -g history-limit 100000

# set first window to index 1 (not 0) to map more to the keyboard layout
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind R refresh-client

# reload tmux config with ctrl + b + r
unbind r
bind r \
    source-file ~/.tmux.conf \;\
    display -d 2000 'Reloaded tmux config.'


unbind C-w
bind-key C-w kill-pane

set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set-option -g focus-events on

set-option -g allow-rename off
set -g default-terminal "tmux-256color"

# --- Claude Code window naming -------------------------------------------
# The `claude` launcher execs a version-named binary
# (~/.local/share/claude/versions/2.1.226), so tmux's automatic rename picks up
# "2.1.226" as the window name. Detect those panes and use Claude's own OSC
# title instead -- it's a live summary of what the agent is doing.
#
# These @_claude_* formats are the single source of truth for the integration:
# tmux/claude-agents.sh evaluates them too (via `list-panes -f`) rather than
# re-implementing the pane matching and the state vocabulary in awk.
set -g automatic-rename on
set -g @_claude_pane "#{||:#{m:*claude*,#{pane_current_command}},#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}}}"
# Per-pane @claude_state is set by tmux/claude-status.sh from Claude Code hooks.
set -g @_claude_glyph "#{?#{==:#{@claude_state},busy},●,#{?#{==:#{@claude_state},wait},◍,✦}}"
set -g @_claude_label "#{?#{==:#{@claude_state},busy},working,#{?#{==:#{@claude_state},wait},NEEDS YOU,idle}}"
# Claude's title usually starts with a spinner glyph; strip it so the name stops
# flickering. Match only a leading *non-alphanumeric* token: `^[^ ]* ` would eat
# the first real word of the titles that carry no spinner, rendering
# "Claude Code" as "Code".
set -g @_claude_title "#{s|^[^A-Za-z0-9] ||:pane_title}"
set -g automatic-rename-format "#{?#{E:@_claude_pane},#{E:@_claude_glyph} #{=/24/…:#{E:@_claude_title}},#{pane_current_command}}"

# Jump to any Claude pane across all sessions.
bind a display-popup -E -w 80% -h 60% "$HOME/configs/tmux/claude-agents.sh"

# Browse the files the agent in *this* pane has edited. The pane id is passed
# as an argument rather than substituted into the path: tmux leaves the leading
# `%` of #{pane_id} alone (`#{s/%//:pane_id}` does not strip it), so the shell
# side keeps the id verbatim and both ends agree on the filename.
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
    "$HOME/configs/tmux/claude-edits.sh '#{pane_id}'"

# Popups over the agent pane, rather than a split beside it. A Claude pane is
# usually full-height and reflows badly when it loses columns, so a transient
# overlay is cheaper than resizing it to run one git command.
# `<prefix> t` is the clock, so lazygit takes `g`.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind -n M-t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

setw -g monitor-activity off
set -g visual-activity off

set -g set-titles on
# Outer terminal (Ghostty) title: session + window, no pane noise.
set -g set-titles-string "#S · #W"

set -g status-position top

set -as terminal-features 'xterm*:extkeys'

# Status bar styling/content is owned by tmux-powerline (see ~/configs/tmux/tmux-powerline/).
# Leaving these settings in would re-clobber powerline on every `<prefix> r`.
# set -g status-left-style bg=black,fg=white
# set -g status-right-style bg=white,fg=black
# set -g status-left-length 30
# set -g status-left  "  #{=/20/…:session_name}  "
# set -g status-right "  %l:%M %p %D  "
# set -g window-status-format "  #{?#{m:nvim,#{pane_current_command}},λ,#{?#{m:claude,#{pane_current_command}},✦,$}} #I: #W  "
# set -g window-status-current-format " [#{?#{m:nvim,#{pane_current_command}},λ,#{?#{m:claude,#{pane_current_command}},✦,$}} #I: #W] "
# set -g window-status-current-style bg=white,fg=black
# set -g status-style bg=black,fg=white

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind D split-window -h -l 50% -c "#{pane_current_path}"

# seamless navigation across tmux panes and neovim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

#bind B run-shell 'tmux rename-session "$(git -C "#{pane_current_path}" rev-parse --abbrev-ref HEAD 2>/dev/null | tr "./" "__" || echo unknown)"'

bind m \
    set -g mouse \;\
    display "Mouse: #{?mouse,on,off}"

set-option -g allow-passthrough on
set-option -g set-clipboard on

set -s copy-command 'printf "\033]52;c;$(base64)\a" > /dev/tty'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode Escape send -X cancel
bind -T copy-mode q send -X cancel
bind -T copy-mode C-c send -X cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi C-c send -X cancel

set -s extended-keys on

set -ag terminal-overrides ',*:RGB:Smulx=\E[4::%p1%dm:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'erikw/tmux-powerline'

run '$HOME/configs/tmux/tpm/tpm'

